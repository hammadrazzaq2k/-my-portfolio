    - name: Deploy to AWS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ubuntu
        password: ${{ secrets.AWS_PASSWORD }}
        script: |
          sudo docker pull hammadrazzaq2k/my-portfolio:latest
          sudo docker stop portfolio || true
          sudo docker rm portfolio || true
          sudo docker run -d -p 80:80 --name portfolio hammadrazzaq2k/my-portfolio:latest
