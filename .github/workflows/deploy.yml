name: Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Get code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: docker build -t hammadrazzaq2k/my-portfolio:latest .

    - name: Push to Docker Hub
      run: docker push hammadrazzaq2k/my-portfolio:latest

    - name: Deploy to AWS
      env:
        PRIVATE_KEY: ${{ secrets.AWS_KEY }}
        HOST: ${{ secrets.AWS_HOST }}
      run: |
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 400 private_key.pem
        ssh -i private_key.pem -o StrictHostKeyChecking=no ubuntu@$HOST "
          sudo docker pull hammadrazzaq2k/my-portfolio:latest &&
          sudo docker stop portfolio || true &&
          sudo docker rm portfolio || true &&
          sudo docker run -d -p 80:80 --name portfolio hammadrazzaq2k/my-portfolio:latest
        "
        rm private_key.pem
